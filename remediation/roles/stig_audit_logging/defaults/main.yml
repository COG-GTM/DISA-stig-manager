---
# DISA RHEL 9 STIG - Audit Logging Defaults
# NIST 800-53: AU-2, AU-3, AU-4, AU-5, AU-9, AU-12

# V-258151: Audit log storage capacity (MB)
stig_audit_space_left: 25

# V-258152: Action when audit storage is low
stig_audit_space_left_action: email

# V-258156: Action when audit disk is full
stig_audit_disk_full_action: halt

# V-258157: Maximum audit log file size (MB)
stig_audit_max_log_file: 8

# V-258154: Number of audit log files to retain
stig_audit_num_logs: 5

# supplemental (no RHEL 9 V2R5 rule): Action when max log file size reached
stig_audit_max_log_file_action: rotate

# V-258160: Audit log directory permissions
stig_audit_log_dir_mode: "0750"

# supplemental (no RHEL 9 V2R5 rule): Audit log file permissions
stig_audit_log_mode: "0600"

# V-258167: Enable audit backlog limit at boot
stig_audit_backlog_limit: 8192
