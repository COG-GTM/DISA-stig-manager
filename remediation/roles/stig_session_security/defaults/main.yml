---
# DISA RHEL 9 STIG - Session Security Defaults
# These values align with DISA STIG requirements. Override only if your
# organization has an approved deviation documented in the POA&M.

# supplemental (no RHEL 9 V2R5 rule): Session lock timeout (seconds) - STIG requires 900 (15 min)
stig_session_lock_timeout: 900

# supplemental (no RHEL 9 V2R5 rule): Session lock delay after idle (seconds)
stig_session_lock_delay: 5

# supplemental (no RHEL 9 V2R5 rule): tmux lock command
stig_tmux_lock_command: "lock-session"

# supplemental (no RHEL 9 V2R5 rule): Concurrent session limit per user
stig_max_concurrent_sessions: 10

# V-258068: Automatic logout for idle CLI sessions (seconds)
stig_cli_timeout: 900

# V-258069: Session lock must require re-authentication
stig_lock_require_reauth: true
