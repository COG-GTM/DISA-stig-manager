---
# DISA RHEL 9 STIG - Service Hardening Remediation
# Controls: CM-7, CM-7(1), CM-6, AU-8, SC-5
# Rule IDs: DISA RHEL 9 STIG V2R5 (U_RHEL_9_STIG_V2R5); see each task name

# --- Disable unnecessary services ---

- name: SUPPLEMENTAL | CM-7 | Disable unnecessary services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop: "{{ stig_disabled_services }}"
  failed_when: false
  tags: [supplemental, cm-7]

# --- Enable required services ---

- name: V-257936, V-257944, V-258152, V-258142 | CAT II | CM-7, AC-17(1), SC-45(1) | Enable required security services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ stig_enabled_services }}"
  tags: [V-257936, V-257944, V-258152, V-258142, cat2, cm-7, ac-17(1), sc-45(1)]

# --- Time synchronization (chrony) ---

- name: V-257943 | CAT II | SC-45(1) | Ensure chrony is installed
  ansible.builtin.dnf:
    name: chrony
    state: present
  tags: [V-257943, cat2, sc-45(1)]

- name: SUPPLEMENTAL | AU-8 | Remove ntp (chrony is preferred)
  ansible.builtin.dnf:
    name: ntp
    state: absent
  tags: [supplemental, au-8]

- name: V-257945/V-257945 | CAT II | AU-8 | Deploy chrony configuration with NTP servers
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chronyd
  tags: [V-257945, cat2, au-8, sc-45(1)]

- name: SUPPLEMENTAL | CM-6 | Ensure chrony runs as chrony user
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/chronyd
    regexp: '^OPTIONS='
    line: 'OPTIONS="-u {{ stig_chrony_user }}"'
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart chronyd
  tags: [supplemental, cm-6]

# --- Firewall (firewalld) ---

- name: V-257935 | CAT II | CM-7, AC-17(1), AC-17(9) | Ensure firewalld is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present
  tags: [V-257935, cat2, cm-7, ac-17(1), ac-17(9)]

- name: V-257936 | CAT II | CM-7, AC-17(1) | Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  tags: [V-257936, cat2, cm-7, ac-17(1)]

- name: V-257937 | CAT II | CM-6 | Set default firewalld zone to drop
  ansible.builtin.command:
    cmd: "firewall-cmd --set-default-zone={{ stig_firewalld_default_zone }}"
  register: firewall_zone_result
  changed_when: "'success' in firewall_zone_result.stdout"
  failed_when: firewall_zone_result.rc != 0 and 'ALREADY_SET' not in firewall_zone_result.stderr
  tags: [V-257937, cat2, cm-6]

- name: V-257937 | CAT II | CM-6 | Allow only required services through firewall
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
    zone: "{{ stig_firewalld_default_zone }}"
  loop: "{{ stig_firewalld_allowed_services }}"
  tags: [V-257937, cat2, cm-6]

# --- Ctrl-Alt-Del ---

- name: V-257785 | CAT I | AC-6(10) | Disable Ctrl-Alt-Delete reboot
  ansible.builtin.systemd:
    name: ctrl-alt-del.target
    masked: true
  when: stig_disable_ctrl_alt_del
  notify: Reload systemd daemon
  tags: [V-257785, cat1, ac-6(10)]

- name: V-257784 | CAT I | AC-6(10) | Disable Ctrl-Alt-Delete burst action
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^(#\s*)?CtrlAltDelBurstAction='
    line: "CtrlAltDelBurstAction=none"
  when: stig_disable_ctrl_alt_del
  notify: Reload systemd daemon
  tags: [V-257784, cat1, ac-6(10)]

# --- Emergency/rescue mode authentication ---

- name: V-258128 | CAT II | AC-3 | Require authentication for emergency mode
  ansible.builtin.lineinfile:
    path: /usr/lib/systemd/system/emergency.service
    regexp: '^ExecStart='
    line: "ExecStart=-/usr/lib/systemd/systemd-sulogin-shell emergency"
  when: stig_emergency_auth
  tags: [V-258128, cat2, ac-3]

- name: V-258129 | CAT II | AC-3 | Require authentication for rescue mode
  ansible.builtin.lineinfile:
    path: /usr/lib/systemd/system/rescue.service
    regexp: '^ExecStart='
    line: "ExecStart=-/usr/lib/systemd/systemd-sulogin-shell rescue"
  when: stig_emergency_auth
  tags: [V-258129, cat2, ac-3]

# --- Package management security ---

- name: V-257820 | CAT I | CM-14 | Ensure gpgcheck is enabled globally
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^gpgcheck'
    line: "gpgcheck=1"
    insertafter: '^\[main\]'
  tags: [V-257820, cat1, cm-14]

- name: V-257822 | CAT I | CM-14 | Ensure repo_gpgcheck is enabled
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^repo_gpgcheck'
    line: "repo_gpgcheck=1"
    insertafter: '^gpgcheck'
  tags: [V-257822, cat1, cm-14]

- name: V-257821 | CAT I | CM-14 | Ensure localpkg_gpgcheck is enabled
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^localpkg_gpgcheck'
    line: "localpkg_gpgcheck=1"
    insertafter: '^repo_gpgcheck'
  tags: [V-257821, cat1, cm-14]

# --- Verification tasks ---

- name: Verify | Firewalld is running
  ansible.builtin.command:
    cmd: firewall-cmd --state
  register: verify_firewalld
  changed_when: false
  failed_when: verify_firewalld.stdout != "running"
  tags: [verify, V-257936, cat2, cm-7, ac-17(1)]

- name: Verify | Chrony is synchronized
  ansible.builtin.command:
    cmd: chronyc tracking
  register: verify_chrony
  changed_when: false
  failed_when: verify_chrony.rc != 0
  tags: [verify, V-257945, cat2, au-8, sc-45(1)]

- name: Verify | Ctrl-Alt-Delete is masked
  ansible.builtin.command:
    cmd: systemctl is-enabled ctrl-alt-del.target
  register: verify_ctrlaltdel
  changed_when: false
  failed_when: verify_ctrlaltdel.stdout != "masked"
  when: stig_disable_ctrl_alt_del
  tags: [verify, V-257785, cat1, ac-6(10)]

- name: Verify | GPG check is enabled
  ansible.builtin.command:
    cmd: grep -c "^gpgcheck=1" /etc/dnf/dnf.conf
  register: verify_gpgcheck
  changed_when: false
  failed_when: verify_gpgcheck.rc != 0
  tags: [verify, V-257820, cat1, cm-14]
