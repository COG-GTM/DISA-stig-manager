---
# DISA RHEL 9 STIG - Service Hardening Defaults
# NIST 800-53: CM-7, CM-6, AU-8

# supplemental (no RHEL 9 V2R5 rule): Services that must be disabled
stig_disabled_services:
  - autofs
  - avahi-daemon
  - cups
  - dhcpd
  - dovecot
  - httpd
  - named
  - nfs-server
  - rpcbind
  - slapd
  - smb
  - squid
  - telnet.socket
  - tftp.socket
  - vsftpd
  - xinetd

# V-257936/V-257944/V-258152/V-258142: Services that must be enabled
stig_enabled_services:
  - firewalld
  - chronyd
  - auditd
  - rsyslog

# V-257945: Chrony NTP configuration
stig_chrony_servers:
  - 0.rhel.pool.ntp.org iburst
  - 1.rhel.pool.ntp.org iburst
  - 2.rhel.pool.ntp.org iburst
  - 3.rhel.pool.ntp.org iburst

# supplemental (no RHEL 9 V2R5 rule): Chrony must run as chrony user
stig_chrony_user: chrony

# V-257937: Default firewalld zone
stig_firewalld_default_zone: drop

# V-257937: Firewalld allowed services (adjust per mission need)
stig_firewalld_allowed_services:
  - ssh

# V-257785: Disable ctrl-alt-del reboot target
stig_disable_ctrl_alt_del: true

# V-257784: Emergency mode requires root password
stig_emergency_auth: true
