---
# DISA RHEL 9 STIG - Authentication Defaults
# NIST 800-53: IA-5(1), AC-7

# V-258107: Minimum password length
stig_password_minlen: 15

# V-258115: Minimum character classes (complexity)
stig_password_minclass: 4

# V-258114: Maximum consecutive repeating characters
stig_password_maxrepeat: 3

# V-258113: Maximum consecutive characters from same class
stig_password_maxclassrepeat: 4

# V-258112: Minimum different characters from previous password
stig_password_difok: 8

# V-258111: Minimum uppercase characters
stig_password_ucredit: -1

# V-258102: Minimum lowercase characters
stig_password_lcredit: -1

# V-258103: Minimum digit characters
stig_password_dcredit: -1

# V-258109: Minimum special characters
stig_password_ocredit: -1

# supplemental (no RHEL 9 V2R5 rule): Password history (remember N previous)
stig_password_remember: 5

# V-258104: Minimum password lifetime (days)
stig_password_min_days: 1

# V-258041: Maximum password lifetime (days)
stig_password_max_days: 60

# V-258054: Account lockout threshold (failed attempts)
stig_faillock_deny: 3

# V-258057: Account lockout duration (seconds), 0 = until admin unlocks
stig_faillock_unlock_time: 0

# V-258056: Fail interval window (seconds)
stig_faillock_fail_interval: 900

# V-258071: Delay between failed login attempts (seconds)
stig_fail_delay: 4
